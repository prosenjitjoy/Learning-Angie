user angie;
worker_processes 4;

error_log /var/log/error.log error;

events {}

http {
  server {
    listen 80;

    location / {
      proxy_pass http://myapp1;
    }

    location /video/ {
      sendfile on;
      # aio on;
      aio threads;
      aio_write off;
      directio 512;
      disable_symlinks if_not_owner;
      output_buffers 1 64k;
    }

    location /i/ {
      alias /data/w3/images/;
    }

    location ~ ^/users/(.+\.(?:gif|jpe?g|png))$ {
      alias /data/w3/images/$1;
    }

    location /images/ {
      # alias /data/w3/images/;
      root /data/w3;
    }

    location /prefix/ {
      # /prefix redirect to /prefix/
      auto_redirect on;
    }
  }

  client {
    proxy_set_header Host docker.example.com;
    proxy_set_header Authorization "Basic ZFflGLbsejpgcWOIEHg2feYsNS=="

    location @docker_events {
    }

    location @docker_containers {
    }
  }

  client {
    proxy_method GET;
    proxy_set_header Host backend.example.com;
    proxy_set_header X-Real-IP $remote_addr;

    location @health_check {
      proxy_pass http://upstream-server/health;
    }
  }

  map $http_sec_fetch_mode $early_hints {
    navigate $http2$http3;
  }

  server {
    # ...
    location / {
      early_hints $early_hints;
      proxy_pass http://example.com;
    }
  }

  server {
    # ...
    location / {
      error_page 404 = @fallback;
    }

    location @fallback {
      proxy_pass http://backend;
    }
  }

  server {
    # ...
    location /path {
      internal;

      error_page 404 = @external;
      proxy_pass http://internal
    }

    location @external {
      proxy_pass http://external
    }
  }

  keepalive_requests 1000;
  keepalive_time 1h;

  server {
    # ...
    location / {
      limit_except GET {
        allow 192.168.1.0/32
        deny all;
      }
    }
  }

  map $slow $rate {
    1 4k;
    2 8k;
  }
  limit_rate $rate;

  server {
    if ($slow) {
      set $limit_rate 4k;
    }

    location /flv/ {
      flv;
      limit_rate_after 500k;
      limit_rate 50k;
    }
  }

  lingering_close on;
  lingering_time 30s;
  lingering_timeout 5s;

  server {
    listen 127.0.0.1:8000
    listen 127.0.0..1;
    listen 8000;
    listen *:8000;
    listen localhost:8000;
    listen [::]:8000;
    listen [::1];
    listen unix:/var/run/angie.sock;
  }

  max_headers 512;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  output_buffers 4 64k;
  postpone_output 0;

  request_pool_size 4k;

  resolver 127.0.0.53 [::1]:5353;
  resolver_timeout 30s;

  server {
    # ...
    location /i/ {
      root /data/w3;
    }
  }

  server {
    # ...
    location / {
      satisfy any;

      allow 192.168.1.0/32;
      deny all;

      auth_basic "closed site";
      auth_basic_user_file conf/htpasswd;
    }

    location /video/ {
      sendfile on;
      sendfile_max_chunk 2m;
      tcp_nopush on;
      aio on;
    }
  }

  server {
    server_name example.com www.example.com

    location / {
      try_files $uri $uri/index.html $uri.html = 404;
    }

    location /images/ {
      try_files $uri /images/default.gif;
    }

    location = /images/default.gif {
      expires 30s;
    }
  }

  types {
    application/octet-stream bin;
    application/octet-stream deb;
    application/octet-stream dmg;
  }

  server {
    location /download/ {
      types {}
      default_type application/octet-stream;
    }
  }

  underscores_in_headers off;

  server {
    location / {
      deny 192.168.1.1;
      allow 192.168.1.0/24;
      allow 10.1.1.0/16;
      allow 2001:0db8::/32;
      deny all;
    }
  }

  server {
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate $acme_cert_rsa;
    ssl_certificate_key $acme_cert_key_rsa;

    ssl_certificate $acme_cert_ecdsa;
    ssl_certificate_key $acme_cert_key_ecdsa;

    acme rsa;
    acme ecdsa;
  }

  acme_dns_port 8053;
  acme_http_port 8080;

  server {
    location / {
      autoindex on;
      autoindex_exact_size on;
      autoindex_format html;
    }
  }

  geoip_country GeoIP.dat;
  geoip_city GeoLiteCity.dat;
  geoip_proxy 192.168.100.0/24;
  geoip_proxy 2001.0db8::/32;
  geoip_proxy_recursive on;

  server {
    listen 9000;
    http2 on;

    grpc_ssl_certificate $grpc_ssl_server_name.crt;
    grpc_ssl_certificate_key $grpc_ssl_server_name.key;
    grpc_ssl_certificate_cache max=1000 inactive=20s valid=1m;

    location / {
      grpc_pass 127.0.0.1:9000;
    }
  }

  gzip on;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/html;

  expires 24h;
  expires modified +24h;
  expires @24h;
  expires 0;
  expires -1;
  expires epoch;
  add_header Cache-Control private;

  map $sent_http_content_type $expires {
    default off;
    application/pdf 42d;
    ~image/ max;
  }

  expires $expires;

  log_format compression '$remote_addr - $remote_user [$time_local] ' '"$request" $status $bytes_sent ' '"$http_referer" "$http_user_agent" "$gzip_ratio"';
  access_log /spool/logs/angie-access.log compression buffer=32k;

  map $http_user_agent $mobile {
    default 0;
    "~Opera Mini" 1;
  }

  server {
    # ...

    location / {
      proxy_pass http://localhost:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_cache cache_zone;
      proxy_cache_valid 200 302 10m;
      proxy_cache_valid 404 1m;

      proxy_redirect off;
    }

    location /proxy {
      proxy_ssl_ntls on;

      proxy_ssl_certificate sign.crt enc.crt;
      proxy_ssl_certificate_key sign.key enc.key;

      proxy_ssl_ciphers "ECC-SM2-WITH-SM4-SM3:ECDHE-SM2-WITH-SM4-SM3:RSA";

      proxy_pass https://backend:443; 
    }
  }

  server {
    listen 443 ssl;
    keepalive_timeout 70;

    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_certificate /usr/local/angie/conf/cert.pem;
    ssl_certificate_key /usr/local/angie/conf/cert.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
  }

  upstream backend {
    zone backend 1m;
    server backend1.example.com weight=5;
    server backend2.example.com:8080;
    server backend3.example.com service=_example._tcp resolve;
    server unix:/tmp/backend3;

    server backup1.example.com:8080 backup;
    server backup2.example.com:8080 backup;
  }

  resolver 127.0.0.53 status_zone=resolver;

  server {
    location / {
      proxy_pass http://backend;
    }
  }

  server {
    listen 443 ssl;

    http2 on;

    ssl_certificate server.crt;
    ssl_certificate_key server.key;
  }
}

http {
  log_format quic '$remote_addr - $remote_user [$time_local] ' '"$request" $status $body_bytes_sent ' '"$http_referer" "$http_user_agent" "$http3"';

  access_log logs/access.log quic;

  server {
    listen 8443 quic reuseport;
    listen 8443 ssl;

    ssl_certificate certs/example.com.crt;
    ssl_certificate_key certs/example.com.key;

    location / {
      add_header Alt-Svc 'h3=":8443"; ma=86400';
    }
  }
}